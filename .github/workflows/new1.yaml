
name: Scrape MyScheme in 10-page batches

on:
  workflow_dispatch:
    inputs:
      total_pages:
        description: "Total pages to scrape"
        type: number
        default: 453
      batch_size:
        description: "Pages per job"
        type: number
        default: 10
      max_parallel:
        description: "Max concurrent jobs (use 1 for sequential)"
        type: number
        default: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - name: Create matrix JSON
        id: make
        shell: bash
        run: |
          TOTAL=${{ github.event.inputs.total_pages }}
          BATCH=${{ github.event.inputs.batch_size }}

          # Build JSON array with commas between objects
          MATRIX='['
          START=1
          FIRST=1
          while [ $START -le $TOTAL ]; do
            END=$(( START + BATCH - 1 ))
            [ $END -gt $TOTAL ] && END=$TOTAL

            if [ $FIRST -eq 1 ]; then
              FIRST=0
            else
              MATRIX+=','
            fi
            MATRIX+="{\"start\":$START,\"end\":$END}"

            START=$(( END + 1 ))
          done
          MATRIX+=']'

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $MATRIX"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      max-parallel: ${{ github.event.inputs.max_parallel }}
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 lxml

      - name: Setup Chrome (for Selenium)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run batch
        env:
          FIRST_PAGE: ${{ matrix.start }}
          LAST_PAGE: ${{ matrix.end }}
          OUTFILE: schemes_list_${{ matrix.start }}-${{ matrix.end }}.csv
        run: |
          python scrape.py --join-lists

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.start }}-${{ matrix.end }}
          path: schemes_list_${{ matrix.start }}-${{ matrix.end }}.csv

  # Optional: merge all CSVs after scraping
  finalize:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge CSVs (keep only first header)
        shell: bash
        run: |
          out="schemes_list_merged.csv"
          first=1
          for f in artifacts/**.csv; do
            if [ $first -eq 1 ]; then
              cat "$f" > "$out"
              first=0
            else
              tail -n +2 "$f" >> "$out"
            fi
          done
          ls -lh "$out"
      - name: Upload merged CSV
        uses: actions/upload-artifact@v4
        with:
          name: schemes_list_merged
          path: schemes_list_merged.csv
